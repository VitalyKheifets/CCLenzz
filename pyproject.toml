[project]
name = "cclenzz"
version = "1.0.0"
description = "Live tabbed terminal view of Claude Code sessions with an LLM intent audit"
requires-python = ">=3.11"
dependencies = []            # HARD RULE: stays empty

[project.scripts]
cclenzz = "cclenzz.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The coverage gate rides on plain `python3 -m pytest` so it is enforced
# everywhere: locally, in scripts/release.sh + scripts/snapshot.sh, and for
# contributors. `fail_under` lives in [tool.coverage.report] below.
addopts = "--cov=src/cclenzz --cov-report=term-missing"

[tool.coverage.run]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
# Ratchet-only-up gate: baseline (55%) minus 2. Never lower this; raise it
# via a dedicated PR once real coverage clears it by >= 3 points. See
# CONTRIBUTING.md for the ratchet policy.
fail_under = 53
